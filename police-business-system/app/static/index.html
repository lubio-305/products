<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>業務管理系統</title>
<link rel="stylesheet" href="/static/common.css" />
</head>
<body>

<div id="login-box" style="max-width:320px; margin: 3rem auto;">
  <h1>業務管理系統登入</h1>
  <input id="username" placeholder="帳號" /><br/>
  <input id="password" type="password" placeholder="密碼" /><br/>
  <button id="login-btn" onclick="login()"><span class="btn-label">登入</span></button>
  <div id="login-feedback" class="feedback"></div>
</div>

<div id="app" style="display:none">
  <div id="nav-container"></div>
  <main>
    <!-- 第一層：承辦人總覽 -->
    <div id="staff-grid-view">
      <h1>承辦人業務總覽</h1>
      <p style="color:var(--color-text-muted); font-size:0.9rem; margin-top:-8px;">點選承辦人查看業務</p>

      <div id="new-top-node" style="display:none">
        <input id="new-top-node-name" placeholder="新業務大類名稱" style="max-width:300px; display:inline-block" />
        <button id="new-top-node-btn" onclick="createTopNode()">＋ 新增頂層業務</button>
        <div id="new-top-node-feedback" class="feedback"></div>
      </div>

      <div id="staff-cards" class="staff-grid"></div>
    </div>

    <!-- 第二層：單一承辦人的業務清單 -->
    <div id="staff-detail-view" style="display:none">
      <a href="#" class="back-link" onclick="backToStaffGrid(); return false;">&larr; 回承辦人總覽</a>
      <div id="staff-detail-header" class="staff-detail-header"></div>
      <div id="staff-detail-cards" class="card-grid"></div>
    </div>
  </main>
</div>

<script src="/static/icons.js"></script>
<script src="/static/common.js"></script>
<script>
let currentUser = null;
let allCards = [];
let allUsers = [];

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("login-btn");
  try {
    const user = await withFeedback("login-feedback", btn, "登入中…", "登入成功", () =>
      api("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      })
    );
    enterApp(user);
  } catch (e) { /* 錯誤訊息已由 withFeedback 顯示 */ }
}

function enterApp(user) {
  currentUser = user;
  document.getElementById("login-box").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("nav-container").innerHTML = renderNav(user, "index");
  if (user.is_admin) {
    document.getElementById("new-top-node").style.display = "block";
  }
  loadOverview();
}

const STATUS_LABEL = {
  not_due: ["尚未到期", "gray"],
  open: ["可開始敘獎", "yellow"],
  due_soon: ["即將逾期", "red"],
  overdue: ["已逾期", "dark-red"],
  done: ["已完成", "green"],
};
// 顯示在承辦人卡片上的「最需要注意」狀態，數字越小越優先
const STATUS_PRIORITY = { overdue: 0, due_soon: 1, open: 2, not_due: 3, done: 4 };

async function loadOverview() {
  const [cards, users] = await Promise.all([api("/api/nodes/cards"), api("/api/users")]);
  allCards = cards;
  allUsers = users;
  renderStaffGrid();
}

function initials(name) {
  return name ? name[0] : "?";
}

function renderStaffGrid() {
  document.getElementById("staff-cards").innerHTML = allUsers
    .map((u) => {
      const items = allCards.filter((c) => c.primary_user && c.primary_user.id === u.id);
      const withStatus = items.filter((c) => c.award_status);
      let statusBadge = "";
      if (withStatus.length > 0) {
        const worst = withStatus.reduce((a, b) =>
          STATUS_PRIORITY[a.award_status] <= STATUS_PRIORITY[b.award_status] ? a : b
        );
        const [label, color] = STATUS_LABEL[worst.award_status];
        statusBadge = `<span class="badge ${color}">${label}</span>`;
      }
      const tags = items
        .slice(0, 4)
        .map((c) => `<span class="tag">${c.name}</span>`)
        .join("");
      const more = items.length > 4 ? `<span class="tag">+${items.length - 4}</span>` : "";

      return `<div class="staff-card" onclick="showStaffDetail(${u.id})">
        <div class="name-row">
          <div class="avatar" style="background:${u.color || "#9aa0a6"}">${initials(u.display_name)}</div>
          <div class="name">${u.display_name}</div>
        </div>
        <div class="count">${icon("folder")}負責 ${items.length} 項 ${statusBadge}</div>
        <div class="tags">${tags}${more}</div>
      </div>`;
    })
    .join("");
}

function showStaffDetail(userId) {
  const user = allUsers.find((u) => u.id === userId);
  if (!user) return;

  document.getElementById("staff-grid-view").style.display = "none";
  document.getElementById("staff-detail-view").style.display = "block";

  document.getElementById("staff-detail-header").innerHTML = `
    <div class="avatar" style="background:${user.color || "#9aa0a6"}">${initials(user.display_name)}</div>
    <h1 style="margin:0">${user.display_name}</h1>
  `;

  const items = allCards.filter((c) => c.primary_user && c.primary_user.id === userId);
  renderBusinessCards("staff-detail-cards", items);
}

function backToStaffGrid() {
  document.getElementById("staff-detail-view").style.display = "none";
  document.getElementById("staff-grid-view").style.display = "block";
  loadOverview();
}

function renderBusinessCards(containerId, items) {
  const el = document.getElementById(containerId);
  if (items.length === 0) {
    el.innerHTML = `<div class="empty-state">目前沒有負責的業務項目</div>`;
    return;
  }

  el.innerHTML = items
    .map((c) => {
      const color = c.primary_user ? c.primary_user.color : "#c7ccd1";
      const support = c.support_names.length
        ? `<div class="support">協辦：${c.support_names.join("、")}</div>`
        : "";
      const status = c.award_status
        ? `<div class="card-status"><span class="badge ${STATUS_LABEL[c.award_status][1]}">${STATUS_LABEL[c.award_status][0]}</span></div>`
        : "";
      return `<div class="card" style="--card-color:${color}" onclick="loadNode(${c.id})">
        ${c.breadcrumb ? `<div class="breadcrumb">${c.breadcrumb}</div>` : ""}
        <div class="title">${c.name}</div>
        ${support}
        ${status}
        <a href="#" class="add-child" onclick="event.stopPropagation(); addChildNode(${c.id}, '${c.name.replace(/'/g, "\\'")}'); return false;" title="在這個業務下新增子項目">${icon("plus")} 新增子項目</a>
      </div>`;
    })
    .join("");
}

function loadNode(nodeId) {
  window.location.href = `/static/node.html?id=${nodeId}`;
}

async function createTopNode() {
  const btn = document.getElementById("new-top-node-btn");
  const name = document.getElementById("new-top-node-name").value.trim();
  if (!name) {
    showFeedback("new-top-node-feedback", "請輸入業務名稱", "error");
    return;
  }
  try {
    await withFeedback("new-top-node-feedback", btn, "新增中…", `已新增「${name}」`, () =>
      api("/api/nodes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, parent_id: null }),
      })
    );
    document.getElementById("new-top-node-name").value = "";
    loadOverview();
  } catch (e) { /* 已顯示錯誤訊息 */ }
}

async function addChildNode(parentId, parentName) {
  const name = window.prompt(`在「${parentName}」底下新增子項目，請輸入名稱：`);
  if (!name || !name.trim()) return;
  try {
    await api("/api/nodes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim(), parent_id: parentId }),
    });
    // 重新載入資料，如果目前在承辦人詳細頁就留在原地刷新
    const [cards] = await Promise.all([api("/api/nodes/cards")]);
    allCards = cards;
    if (document.getElementById("staff-detail-view").style.display !== "none") {
      const header = document.getElementById("staff-detail-header");
      const currentUserId = allUsers.find((u) => header.innerHTML.includes(u.display_name))?.id;
      if (currentUserId) {
        renderBusinessCards("staff-detail-cards", allCards.filter((c) => c.primary_user && c.primary_user.id === currentUserId));
      }
    } else {
      renderStaffGrid();
    }
  } catch (e) {
    alert(`新增失敗：${e.message}`);
  }
}

(async () => {
  try {
    const user = await api("/api/auth/me");
    enterApp(user);
  } catch (e) { /* 尚未登入 */ }
})();
</script>
</body>
</html>
