<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>業務管理系統</title>
<link rel="stylesheet" href="/static/common.css" />
</head>
<body>

<div id="login-box" style="max-width:320px; margin: 3rem auto;">
  <h1>業務管理系統登入</h1>
  <input id="username" placeholder="帳號" /><br/>
  <input id="password" type="password" placeholder="密碼" /><br/>
  <button id="login-btn" onclick="login()"><span class="btn-label">登入</span></button>
  <div id="login-feedback" class="feedback"></div>
</div>

<div id="app" style="display:none">
  <div id="nav-container"></div>
  <main>
    <h1>業務總覽</h1>

    <div id="new-top-node" style="display:none">
      <input id="new-top-node-name" placeholder="新業務大類名稱" style="max-width:300px; display:inline-block" />
      <button id="new-top-node-btn" onclick="createTopNode()">＋ 新增頂層業務</button>
      <div id="new-top-node-feedback" class="feedback"></div>
    </div>

    <div id="staff-filter" class="staff-filter"></div>
    <div id="cards" class="card-grid"></div>
  </main>
</div>

<script src="/static/icons.js"></script>
<script src="/static/common.js"></script>
<script>
let currentUser = null;
let allCards = [];
let allUsers = [];
let activeFilterUserId = null;

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("login-btn");
  try {
    const user = await withFeedback("login-feedback", btn, "登入中…", "登入成功", () =>
      api("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      })
    );
    enterApp(user);
  } catch (e) { /* 錯誤訊息已由 withFeedback 顯示 */ }
}

function enterApp(user) {
  currentUser = user;
  document.getElementById("login-box").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("nav-container").innerHTML = renderNav(user, "index");
  if (user.is_admin) {
    document.getElementById("new-top-node").style.display = "block";
  }
  loadOverview();
}

const STATUS_LABEL = {
  not_due: ["尚未到期", "gray"],
  open: ["可開始敘獎", "yellow"],
  due_soon: ["即將逾期", "red"],
  overdue: ["已逾期", "dark-red"],
  done: ["已完成", "green"],
};

async function loadOverview() {
  const [cards, users] = await Promise.all([api("/api/nodes/cards"), api("/api/users")]);
  allCards = cards;
  allUsers = users;
  renderStaffFilter();
  renderCards();
}

function renderStaffFilter() {
  const staffWithCards = allUsers.filter((u) => allCards.some((c) => c.primary_user && c.primary_user.id === u.id));
  const buttons = staffWithCards
    .map(
      (u) => `<button
        class="${activeFilterUserId === u.id ? "active" : ""}"
        style="${activeFilterUserId === u.id ? `background:${u.color};border-color:${u.color}` : ""}"
        onclick="setFilter(${u.id})">
        <span class="swatch" style="background:${u.color}"></span>${u.display_name}
      </button>`
    )
    .join("");
  const clearBtn = activeFilterUserId
    ? `<button onclick="setFilter(null)">${icon("filter")}顯示全部</button>`
    : "";
  document.getElementById("staff-filter").innerHTML = buttons + clearBtn;
}

function setFilter(userId) {
  activeFilterUserId = userId;
  renderStaffFilter();
  renderCards();
}

function renderCards() {
  const visible = activeFilterUserId
    ? allCards.filter((c) => c.primary_user && c.primary_user.id === activeFilterUserId)
    : allCards;

  if (visible.length === 0) {
    document.getElementById("cards").innerHTML = `<div class="empty-state">目前沒有業務項目</div>`;
    return;
  }

  document.getElementById("cards").innerHTML = visible
    .map((c) => {
      const color = c.primary_user ? c.primary_user.color : "#c7ccd1";
      const owner = c.primary_user
        ? `<span class="swatch" style="background:${color}"></span>${c.primary_user.display_name}`
        : `${icon("user")}尚未指派`;
      const support = c.support_names.length
        ? `<div class="support">協辦：${c.support_names.join("、")}</div>`
        : "";
      const status = c.award_status
        ? `<div class="card-status"><span class="badge ${STATUS_LABEL[c.award_status][1]}">${STATUS_LABEL[c.award_status][0]}</span></div>`
        : "";
      return `<div class="card" style="--card-color:${color}" onclick="loadNode(${c.id})">
        ${c.breadcrumb ? `<div class="breadcrumb">${c.breadcrumb}</div>` : ""}
        <div class="title">${c.name}</div>
        <div class="primary-user">${owner}</div>
        ${support}
        ${status}
        <a href="#" class="add-child" onclick="event.stopPropagation(); addChildNode(${c.id}, '${c.name.replace(/'/g, "\\'")}'); return false;" title="在這個業務下新增子項目">${icon("plus")} 新增子項目</a>
      </div>`;
    })
    .join("");
}

function loadNode(nodeId) {
  window.location.href = `/static/node.html?id=${nodeId}`;
}

async function createTopNode() {
  const btn = document.getElementById("new-top-node-btn");
  const name = document.getElementById("new-top-node-name").value.trim();
  if (!name) {
    showFeedback("new-top-node-feedback", "請輸入業務名稱", "error");
    return;
  }
  try {
    await withFeedback("new-top-node-feedback", btn, "新增中…", `已新增「${name}」`, () =>
      api("/api/nodes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, parent_id: null }),
      })
    );
    document.getElementById("new-top-node-name").value = "";
    loadOverview();
  } catch (e) { /* 已顯示錯誤訊息 */ }
}

async function addChildNode(parentId, parentName) {
  const name = window.prompt(`在「${parentName}」底下新增子項目，請輸入名稱：`);
  if (!name || !name.trim()) return;
  try {
    await api("/api/nodes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim(), parent_id: parentId }),
    });
    loadOverview();
  } catch (e) {
    alert(`新增失敗：${e.message}`);
  }
}

(async () => {
  try {
    const user = await api("/api/auth/me");
    enterApp(user);
  } catch (e) { /* 尚未登入 */ }
})();
</script>
</body>
</html>
