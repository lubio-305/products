<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>業務管理系統</title>
<link rel="stylesheet" href="/static/common.css" />
</head>
<body>

<div id="login-box" style="max-width:320px; margin: 3rem auto;">
  <h1>業務管理系統登入</h1>
  <input id="username" placeholder="帳號" /><br/>
  <input id="password" type="password" placeholder="密碼" /><br/>
  <button id="login-btn" onclick="login()">登入</button>
  <div id="login-feedback" class="feedback"></div>
</div>

<div id="app" style="display:none">
  <div id="nav-container"></div>
  <main>
    <h1>業務總覽</h1>
    <div id="tree"></div>
  </main>
</div>

<script src="/static/common.js"></script>
<script>
async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("login-btn");
  try {
    const user = await withFeedback("login-feedback", btn, "登入中…", "登入成功", () =>
      api("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      })
    );
    enterApp(user);
  } catch (e) { /* 錯誤訊息已由 withFeedback 顯示 */ }
}

function enterApp(user) {
  document.getElementById("login-box").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("nav-container").innerHTML = renderNav(user, "index");
  loadTree();
}

async function loadTree() {
  const nodes = await api("/api/nodes");
  const byParent = {};
  nodes.forEach((n) => {
    (byParent[n.parent_id] = byParent[n.parent_id] || []).push(n);
  });

  function renderList(parentId) {
    const children = byParent[parentId] || [];
    if (children.length === 0) return "";
    const items = children
      .map((n) => `<li><span class="node-name" onclick="loadNode(${n.id})">${n.name}</span>${n.is_leaf ? '<span id="badge-' + n.id + '"></span>' : ""}${renderList(n.id)}</li>`)
      .join("");
    return `<ul class="tree">${items}</ul>`;
  }

  document.getElementById("tree").innerHTML = renderList(null);

  nodes.filter((n) => n.is_leaf).forEach(async (n) => {
    try {
      const records = await api(`/api/nodes/${n.id}/awards/records`);
      const latest = records[records.length - 1];
      if (latest) {
        const el = document.getElementById(`badge-${n.id}`);
        const label = { not_due: ["尚未到期", "gray"], open: ["可開始敘獎", "yellow"], due_soon: ["即將逾期", "red"], overdue: ["已逾期", "dark-red"], done: ["已完成", "green"] }[latest.status];
        el.outerHTML = `<span class="badge ${label[1]}">${label[0]}</span>`;
      }
    } catch (e) { /* 該節點尚未設定敘獎週期 */ }
  });
}

function loadNode(nodeId) {
  window.location.href = `/static/node.html?id=${nodeId}`;
}

(async () => {
  try {
    const user = await api("/api/auth/me");
    enterApp(user);
  } catch (e) { /* 尚未登入 */ }
})();
</script>
</body>
</html>
