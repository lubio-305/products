<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>業務管理系統</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; margin: 2rem; }
  #login-box { max-width: 320px; }
  #app { display: none; }
  ul.tree { list-style: none; padding-left: 1.2rem; }
  .node-name { cursor: pointer; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; margin-left: 6px; color: #fff; }
  .badge.gray { background: #9aa0a6; }
  .badge.yellow { background: #f2a600; }
  .badge.red { background: #e05a47; }
  .badge.dark-red { background: #a12a1d; }
  .badge.green { background: #2e8b57; }
  input, button { padding: 4px 8px; margin: 2px 0; }
</style>
</head>
<body>

<div id="login-box">
  <h1>業務管理系統登入</h1>
  <input id="username" placeholder="帳號" /><br/>
  <input id="password" type="password" placeholder="密碼" /><br/>
  <button onclick="login()">登入</button>
  <p id="login-error" style="color:red"></p>
</div>

<div id="app">
  <h1>業務總覽</h1>
  <p>登入身份：<span id="whoami"></span> <button onclick="logout()">登出</button></p>
  <div id="tree"></div>
</div>

<script>
async function api(path, options = {}) {
  const res = await fetch(path, { credentials: "include", ...options });
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.status === 204 ? null : res.json();
}

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  try {
    const user = await api("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    document.getElementById("login-box").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("whoami").textContent = `${user.display_name}${user.is_admin ? "（管理者）" : ""}`;
    loadTree();
  } catch (e) {
    document.getElementById("login-error").textContent = e.message;
  }
}

async function logout() {
  await api("/api/auth/logout", { method: "POST" });
  location.reload();
}

async function loadTree() {
  const nodes = await api("/api/nodes");
  const byParent = {};
  nodes.forEach((n) => {
    (byParent[n.parent_id] = byParent[n.parent_id] || []).push(n);
  });

  function renderList(parentId) {
    const children = byParent[parentId] || [];
    if (children.length === 0) return "";
    const items = children
      .map((n) => `<li><span class="node-name" onclick="loadNode(${n.id})">${n.name}</span>${n.is_leaf ? '<span id="badge-' + n.id + '"></span>' : ""}${renderList(n.id)}</li>`)
      .join("");
    return `<ul class="tree">${items}</ul>`;
  }

  document.getElementById("tree").innerHTML = renderList(null);

  nodes.filter((n) => n.is_leaf).forEach(async (n) => {
    try {
      const records = await api(`/api/nodes/${n.id}/awards/records`);
      const latest = records[records.length - 1];
      if (latest) {
        const el = document.getElementById(`badge-${n.id}`);
        const label = { not_due: ["尚未到期", "gray"], open: ["可開始敘獎", "yellow"], due_soon: ["即將逾期", "red"], overdue: ["已逾期", "dark-red"], done: ["已完成", "green"] }[latest.status];
        el.outerHTML = `<span class="badge ${label[1]}">${label[0]}</span>`;
      }
    } catch (e) { /* 該節點尚未設定敘獎週期 */ }
  });
}

function loadNode(nodeId) {
  window.location.href = `/static/node.html?id=${nodeId}`;
}

(async () => {
  try {
    const user = await api("/api/auth/me");
    document.getElementById("login-box").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("whoami").textContent = `${user.display_name}${user.is_admin ? "（管理者）" : ""}`;
    loadTree();
  } catch (e) { /* 尚未登入 */ }
})();
</script>
</body>
</html>
