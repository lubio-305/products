<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>業務節點</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; margin: 2rem; max-width: 700px; }
  section { border-top: 1px solid #ddd; padding-top: 1rem; margin-top: 1rem; }
  input, textarea, select { display: block; margin: 4px 0 8px; padding: 4px; width: 100%; max-width: 400px; }
  button { padding: 4px 10px; }
  li { margin-bottom: 4px; }
</style>
</head>
<body>
<p><a href="/static/index.html">&larr; 回總覽</a></p>
<h1 id="node-title">載入中...</h1>

<section>
  <h2>目前承辦人</h2>
  <ul id="assignment-list"></ul>
</section>

<section>
  <h2>規定 / 計畫版本</h2>
  <ul id="regulation-list"></ul>
  <h3>上傳新版本</h3>
  <input id="reg-title" placeholder="規定/計畫名稱" />
  <input id="reg-effective" type="date" />
  <input id="reg-file" type="file" />
  <button onclick="uploadRegulation()">上傳</button>
</section>

<section>
  <h2>公文 / 補充資料</h2>
  <ul id="attachment-list"></ul>
  <h3>上傳附件</h3>
  <textarea id="att-summary" placeholder="重點摘要（3-5行）"></textarea>
  <input id="att-file" type="file" />
  <button onclick="uploadAttachment()">上傳</button>
</section>

<section>
  <h2>敘獎週期</h2>
  <ul id="award-list"></ul>
  <h3>新增敘獎週期</h3>
  <select id="cycle-type">
    <option value="quarterly">每季</option>
    <option value="semiannual">每半年</option>
    <option value="annual">每年</option>
  </select>
  <input id="cycle-start" type="date" />
  <button onclick="createCycle()">建立</button>
</section>

<script>
const params = new URLSearchParams(location.search);
const nodeId = params.get("id");

async function api(path, options = {}) {
  const res = await fetch(path, { credentials: "include", ...options });
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.status === 204 ? null : res.json();
}

const STATUS_LABEL = {
  not_due: "尚未到期", open: "可開始敘獎", due_soon: "即將逾期", overdue: "已逾期", done: "已完成",
};
const ROLE_LABEL = { primary: "主辦", support: "協辦" };

async function loadAll() {
  const nodes = await api("/api/nodes");
  const node = nodes.find((n) => String(n.id) === nodeId);
  document.getElementById("node-title").textContent = node ? node.name : "找不到節點";

  const assignments = await api(`/api/nodes/${nodeId}/assignments`);
  document.getElementById("assignment-list").innerHTML = assignments
    .map((a) => `<li>${a.display_name}（${ROLE_LABEL[a.role]}）</li>`)
    .join("") || "<li>尚未指派</li>";

  const regs = await api(`/api/nodes/${nodeId}/regulations`);
  document.getElementById("regulation-list").innerHTML = regs
    .map((r) => `<li>v${r.version_no} ${r.title}（生效日 ${r.effective_date}${r.expired_date ? "，失效日 " + r.expired_date : "，現行版本"}）</li>`)
    .join("") || "<li>尚未上傳</li>";

  const atts = await api(`/api/nodes/${nodeId}/attachments`);
  document.getElementById("attachment-list").innerHTML = atts
    .map((a) => `<li>${a.original_filename}（${a.uploaded_at}）<br/>摘要：${a.summary || "（未填寫）"}</li>`)
    .join("") || "<li>尚未上傳</li>";

  const records = await api(`/api/nodes/${nodeId}/awards/records`);
  document.getElementById("award-list").innerHTML = records
    .map((r) => `<li>${r.period_start} ~ ${r.period_end}（期限 ${r.deadline}）：${STATUS_LABEL[r.status]}
      ${r.status !== "done" ? `<button onclick="completeRecord(${r.id})">標記完成</button>` : ""}</li>`)
    .join("") || "<li>尚未設定敘獎週期</li>";
}

async function uploadRegulation() {
  const form = new FormData();
  form.append("title", document.getElementById("reg-title").value);
  form.append("effective_date", document.getElementById("reg-effective").value);
  form.append("file", document.getElementById("reg-file").files[0]);
  await api(`/api/nodes/${nodeId}/regulations`, { method: "POST", body: form });
  loadAll();
}

async function uploadAttachment() {
  const form = new FormData();
  form.append("summary", document.getElementById("att-summary").value);
  form.append("file", document.getElementById("att-file").files[0]);
  await api(`/api/nodes/${nodeId}/attachments`, { method: "POST", body: form });
  loadAll();
}

async function createCycle() {
  await api(`/api/nodes/${nodeId}/awards/cycles`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      cycle_type: document.getElementById("cycle-type").value,
      start_date: document.getElementById("cycle-start").value,
    }),
  });
  loadAll();
}

async function completeRecord(recordId) {
  await api(`/api/nodes/${nodeId}/awards/records/${recordId}/complete`, { method: "POST" });
  loadAll();
}

loadAll();
</script>
</body>
</html>
